ServerRoot "${S3_TEST_HTTPD_ROOT}"
PidFile "${S3_TEST_HTTPD_ROOT}/httpd.pid"
ErrorLog "${S3_TEST_HTTPD_ROOT}/httpd-error.log"
LogLevel warn
ServerName localhost
DefaultRuntimeDir "${S3_TEST_HTTPD_ROOT}"
Mutex file:${S3_TEST_HTTPD_ROOT}
User ${S3_TEST_HTTPD_USER}
Group ${S3_TEST_HTTPD_GROUP}

@LOAD_MPM@
@LOAD_UNIXD@
@LOAD_AUTHZ_CORE@
@LOAD_HEADERS@
@LOAD_PROXY@
@LOAD_PROXY_HTTP@

Listen 127.0.0.1:${S3_TEST_PROXY_PORT}
Listen 127.0.0.1:${S3_TEST_REWRITE_PROXY_PORT}
Listen 127.0.0.1:${S3_TEST_MISSING_XFF_PROXY_PORT}
Listen 127.0.0.1:${S3_TEST_AMBIGUOUS_XFP_PROXY_PORT}

ProxyRequests Off
ProxyTimeout 15
KeepAlive Off

<Location "/">
    Require all granted
</Location>

<VirtualHost 127.0.0.1:${S3_TEST_PROXY_PORT}>
    ProxyPreserveHost On
    ProxyAddHeaders Off
    RequestHeader unset Forwarded early
    RequestHeader unset X-Forwarded-For early
    RequestHeader unset X-Forwarded-Host early
    RequestHeader unset X-Forwarded-Proto early
    RequestHeader set X-Forwarded-For "198.51.100.42" early
    RequestHeader set X-Forwarded-Proto "https" early
    ProxyPass "/" "http://127.0.0.1:${S3_TEST_ORIGIN_PORT}/" connectiontimeout=3 timeout=15
</VirtualHost>

<VirtualHost 127.0.0.1:${S3_TEST_REWRITE_PROXY_PORT}>
    ProxyPreserveHost Off
    ProxyAddHeaders Off
    RequestHeader unset Forwarded early
    RequestHeader unset X-Forwarded-For early
    RequestHeader unset X-Forwarded-Host early
    RequestHeader unset X-Forwarded-Proto early
    RequestHeader set X-Forwarded-For "198.51.100.42" early
    RequestHeader set X-Forwarded-Proto "https" early
    ProxyPass "/" "http://127.0.0.1:${S3_TEST_ORIGIN_PORT}/" connectiontimeout=3 timeout=15
</VirtualHost>

<VirtualHost 127.0.0.1:${S3_TEST_MISSING_XFF_PROXY_PORT}>
    ProxyPreserveHost On
    ProxyAddHeaders Off
    RequestHeader unset Forwarded early
    RequestHeader unset X-Forwarded-For early
    RequestHeader unset X-Forwarded-Host early
    RequestHeader unset X-Forwarded-Proto early
    RequestHeader set X-Forwarded-Proto "https" early
    ProxyPass "/" "http://127.0.0.1:${S3_TEST_ORIGIN_PORT}/" connectiontimeout=3 timeout=15
</VirtualHost>

<VirtualHost 127.0.0.1:${S3_TEST_AMBIGUOUS_XFP_PROXY_PORT}>
    ProxyPreserveHost On
    ProxyAddHeaders Off
    RequestHeader unset Forwarded early
    RequestHeader unset X-Forwarded-For early
    RequestHeader unset X-Forwarded-Host early
    RequestHeader unset X-Forwarded-Proto early
    RequestHeader set X-Forwarded-For "198.51.100.42" early
    RequestHeader set X-Forwarded-Proto "https, http" early
    ProxyPass "/" "http://127.0.0.1:${S3_TEST_ORIGIN_PORT}/" connectiontimeout=3 timeout=15
</VirtualHost>
