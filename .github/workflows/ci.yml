name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: curl, mbstring, openssl, pdo_sqlite, simplexml, sockets
          coverage: none
        env:
          fail-fast: "true"

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: locked

      - run: composer validate --strict
      - run: composer audit --locked
      - run: composer analyse
      - run: composer cs:check
      - run: composer test
      - name: Validate production soak runner
        env:
          S3_SOAK_COMMIT: ci
          S3_SOAK_DATA_DIR: /tmp/opsfour-s3-production-soak/data/ci
          S3_SOAK_HOST_GID: "1001"
          S3_SOAK_HOST_UID: "1001"
          S3_SOAK_IMAGE: opsfour-s3-production-soak:ci
          S3_SOAK_QUALIFICATION: smoke
          S3_SOAK_STARTED_AT: "2026-01-01T00:00:00Z"
          S3_SOAK_STARTED_EPOCH: "1767225600"
          S3_SOAK_STATE_DIR: /tmp/opsfour-s3-production-soak
        run: |
          shellcheck scripts/run-production-soak \
            scripts/production-soak-container \
            tests/production-soak-image-cache-test.sh \
            tests/production-soak-status-test.sh
          sh -n scripts/run-production-soak \
            scripts/production-soak-container \
            tests/production-soak-image-cache-test.sh \
            tests/production-soak-status-test.sh
          tests/production-soak-image-cache-test.sh
          tests/production-soak-status-test.sh
          if S3_SOAK_STATE_DIR=/ scripts/run-production-soak status; then
            echo "State-directory root was accepted" >&2
            exit 1
          fi
          if S3_SOAK_STATE_DIR="${RUNNER_TEMP}/.." scripts/run-production-soak status; then
            echo "State-directory traversal was accepted" >&2
            exit 1
          fi
          if S3_SOAK_IMAGE='invalid image' scripts/run-production-soak start; then
            echo "Unsafe production-soak image reference was accepted" >&2
            exit 1
          fi
          mkdir "${RUNNER_TEMP}/soak-state-target"
          ln -s "${RUNNER_TEMP}/soak-state-target" "${RUNNER_TEMP}/soak-state-link"
          if S3_SOAK_STATE_DIR="${RUNNER_TEMP}/soak-state-link" scripts/run-production-soak status; then
            echo "State-directory symlink was accepted" >&2
            exit 1
          fi
          mkdir "${RUNNER_TEMP}/soak-state-nonempty"
          touch "${RUNNER_TEMP}/soak-state-nonempty/marker"
          if S3_SOAK_STATE_DIR="${RUNNER_TEMP}/soak-state-nonempty" scripts/run-production-soak start; then
            echo "Non-empty state directory was accepted" >&2
            exit 1
          fi
          for metadata in sqlite postgres mysql; do
            profiles=()
            dsn=""
            if [ "${metadata}" = postgres ]; then
              profiles=(--profile postgres)
              dsn="host=postgres port=5432 dbname=s3server user=s3 password=s3audit"
            elif [ "${metadata}" = mysql ]; then
              profiles=(--profile mysql)
              dsn="host=mysql;port=3306;dbname=s3server;user=s3;password=s3audit"
            fi
            S3_SOAK_METADATA_DRIVER="${metadata}" S3_SOAK_METADATA_DSN="${dsn}" \
              docker compose \
                --project-name opsfour-s3-production-soak \
                --file docker/production-soak/compose.yml \
                "${profiles[@]}" config --quiet
          done

  dependency-compatibility:
    name: Dependencies (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lowest-laravel-12-symfony-7.4
            dependencies: lowest
            laravel: ^12.0
            symfony: ^7.4
          - name: highest-laravel-13-symfony-8.1
            dependencies: highest
            laravel: ^13.0
            symfony: ^8.1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: curl, mbstring, openssl, pdo_sqlite, simplexml, sockets
          coverage: none
        env:
          fail-fast: "true"

      - name: Constrain runtime compatibility target
        run: >-
          composer require --no-update
          symfony/console:${{ matrix.symfony }}

      - name: Constrain development framework compatibility target
        run: >-
          composer require --dev --no-update
          laravel/framework:${{ matrix.laravel }}
          illuminate/console:${{ matrix.laravel }}
          illuminate/support:${{ matrix.laravel }}
          symfony/config:${{ matrix.symfony }}
          symfony/dependency-injection:${{ matrix.symfony }}
          symfony/http-kernel:${{ matrix.symfony }}

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - run: composer show --direct
      - run: composer analyse

      # The dependency-floor job intentionally installs old transitive
      # packages that still emit PHP 8.4 deprecations during Composer autoload.
      # Quality and the highest matrix continue to fail on all deprecations.
      - name: Isolate lowest transitive dependency deprecations
        if: matrix.dependencies == 'lowest'
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/opsfour-lowest-php-ini"
          printf '%s\n' 'error_reporting = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED' \
            > "${RUNNER_TEMP}/opsfour-lowest-php-ini/99-opsfour-lowest.ini"
          php -r 'printf("PHP_INI_SCAN_DIR=%s:%s/opsfour-lowest-php-ini\n", PHP_CONFIG_FILE_SCAN_DIR, getenv("RUNNER_TEMP"));' \
            >> "${GITHUB_ENV}"

      - run: composer test

  metadata-backends:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      mysql:
        image: mysql@sha256:4890b3247d48a6dc1f3ac1e979330af4e543d06f194322f3879b27e6c7052585
        env:
          MYSQL_DATABASE: s3server
          MYSQL_USER: s3
          MYSQL_PASSWORD: s3audit
          MYSQL_ROOT_PASSWORD: s3audit
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ps3audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      postgres:
        image: postgres@sha256:2586e2a95d1c9b31cb2967feb562948f7d364854453d703039b6efa45fe48417
        env:
          POSTGRES_DB: s3server
          POSTGRES_USER: s3
          POSTGRES_PASSWORD: s3audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U s3 -d s3server"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      S3_TEST_MYSQL_METADATA_DSN: host=127.0.0.1 port=3306 user=s3 password=s3audit db=s3server
      S3_TEST_POSTGRES_METADATA_DSN: host=127.0.0.1 port=5432 user=s3 password=s3audit db=s3server

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: curl, mbstring, openssl, pdo_mysql, pdo_pgsql, simplexml, sockets, raphf, pq
          coverage: none
        env:
          fail-fast: "true"

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: locked

      - name: Allow CI metadata user to create MySQL triggers
        run: >-
          docker exec --env MYSQL_PWD=s3audit "${{ job.services.mysql.id }}"
          mysql --user=root
          --execute='SET GLOBAL log_bin_trust_function_creators = 1'

      - name: Prepare isolated migration databases
        run: |
          docker exec --env MYSQL_PWD=s3audit "${{ job.services.mysql.id }}" \
            mysql --user=root \
            --execute="CREATE DATABASE s3audit_package; CREATE DATABASE s3audit_mpu; GRANT ALL PRIVILEGES ON s3audit_package.* TO 's3'@'%'; GRANT ALL PRIVILEGES ON s3audit_mpu.* TO 's3'@'%'; FLUSH PRIVILEGES"
          docker exec --env PGPASSWORD=s3audit "${{ job.services.postgres.id }}" \
            createdb --username=s3 s3audit_package
          docker exec --env PGPASSWORD=s3audit "${{ job.services.postgres.id }}" \
            createdb --username=s3 s3audit_mpu

      - name: Metadata backend parity and concurrency
        run: vendor/bin/phpunit tests/Functional/MetadataBackendIntegrationTest.php

      - name: Stored identity policy inventory on external backends
        run: |
          S3_POLICY_AUDIT_DSN='mysql:host=127.0.0.1;port=3306;dbname=s3server' \
          S3_POLICY_AUDIT_USER=s3 \
          S3_POLICY_AUDIT_PASSWORD=s3audit \
          php scripts/audit-stored-identity-policies.php
          S3_POLICY_AUDIT_DSN='pgsql:host=127.0.0.1;port=5432;dbname=s3server' \
          S3_POLICY_AUDIT_USER=s3 \
          S3_POLICY_AUDIT_PASSWORD=s3audit \
          php scripts/audit-stored-identity-policies.php

      - name: Collector generation migration compatibility
        env:
          S3_TEST_DESTRUCTIVE_METADATA_MIGRATIONS: "1"
          S3_TEST_MYSQL_METADATA_DSN: "host=127.0.0.1;port=3306;dbname=s3audit_package;user=s3;password=s3audit"
          S3_TEST_POSTGRES_METADATA_DSN: host=127.0.0.1 port=5432 dbname=s3audit_package user=s3 password=s3audit
        run: >-
          vendor/bin/phpunit --fail-on-skipped
          tests/Functional/MetadataBackendIntegrationTest.php
          --filter test_external_collector_generation_upgrade_preserves_legacy_intents_and_garbage

      - name: Multipart intent migration and fencing
        env:
          S3_TEST_DESTRUCTIVE_METADATA_MIGRATIONS: "1"
          S3_TEST_MYSQL_METADATA_DSN: "host=127.0.0.1;port=3306;dbname=s3audit_mpu;user=s3;password=s3audit"
          S3_TEST_POSTGRES_METADATA_DSN: host=127.0.0.1 port=5432 dbname=s3audit_mpu user=s3 password=s3audit
        run: >-
          vendor/bin/phpunit --fail-on-skipped
          tests/Functional/MetadataBackendIntegrationTest.php
          --filter test_external_multipart_intent_migration_and_active_claim_fencing

      - name: MySQL v11-to-current migration
        env:
          S3_TEST_DESTRUCTIVE_METADATA_MIGRATIONS: "1"
        run: >-
          vendor/bin/phpunit tests/Functional/MetadataBackendIntegrationTest.php
          --filter 'migrates_v11_schema_to_current.*mysql'

      - name: PostgreSQL v11-to-current migration
        env:
          S3_TEST_DESTRUCTIVE_METADATA_MIGRATIONS: "1"
        run: >-
          vendor/bin/phpunit tests/Functional/MetadataBackendIntegrationTest.php
          --filter 'migrates_v11_schema_to_current.*postgres'
