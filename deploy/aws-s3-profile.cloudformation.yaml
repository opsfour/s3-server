AWSTemplateFormatVersion: '2010-09-09'
Description: Isolated least-privilege AWS S3 profile for opsfour s3-server.

Parameters:
  BucketName:
    Type: String
    MinLength: 3
    MaxLength: 63
    AllowedPattern: '^(?!xn--)(?!sthree-)(?!amzn-s3-demo-)(?!.*(?:-s3alias|--ol-s3|\.mrap|--x-s3|--table-s3)$)[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
  DataPrefix:
    Type: String
    Default: data
    MinLength: 4
    MaxLength: 900
    AllowedPattern: '^data(?:/[A-Za-z0-9][A-Za-z0-9._-]*)*$'
    Description: Canonical data namespace rooted at data; IAM wildcards and dot segments are impossible.
  ReservedPrefix:
    Type: String
    Default: .opsfour
    MinLength: 8
    MaxLength: 700
    AllowedPattern: '^\.opsfour(?:/[A-Za-z0-9][A-Za-z0-9._-]*)*$'
    Description: Canonical attempt/seal namespace rooted at .opsfour and disjoint from DataPrefix.
  RuntimePrincipalArn:
    Type: String
    Description: Exact IAM principal allowed to assume the runtime role.
    AllowedPattern: '^arn:aws:iam::[0-9]{12}:(role|user)/.+$'

Resources:
  ProfileBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  RuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref RuntimePrincipalArn
            Action: sts:AssumeRole
      Policies:
        - PolicyName: isolated-s3-profile
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadBucketAdmissionState
                Effect: Allow
                Action:
                  - s3:GetBucketVersioning
                  - s3:ListBucket
                Resource: !GetAtt ProfileBucket.Arn
              - Sid: MutateOnlyIsolatedPrefixes
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:AbortMultipartUpload
                Resource:
                  - !Sub '${ProfileBucket.Arn}/${DataPrefix}/*'
                  - !Sub '${ProfileBucket.Arn}/${ReservedPrefix}/*'

  ProfileBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref ProfileBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ProfileBucket.Arn
              - !Sub '${ProfileBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false
          - Sid: KeepVersioningDisabled
            Effect: Deny
            Principal: '*'
            Action: s3:PutBucketVersioning
            Resource: !GetAtt ProfileBucket.Arn
          - Sid: KeepLifecycleConfigurationAbsent
            Effect: Deny
            Principal: '*'
            Action: s3:PutLifecycleConfiguration
            Resource: !GetAtt ProfileBucket.Arn

Outputs:
  BucketName:
    Description: New isolated bucket to configure in the AWS profile.
    Value: !Ref ProfileBucket
  RuntimeRoleArn:
    Description: Target role ARN to assume from RuntimePrincipalArn through a supported default-chain shared profile.
    Value: !GetAtt RuntimeRole.Arn
  ExpectedOwnerAccountId:
    Description: Exact account ID to configure as expected_owner_id.
    Value: !Ref AWS::AccountId
  DataPrefix:
    Value: !Ref DataPrefix
  ReservedPrefix:
    Value: !Ref ReservedPrefix
