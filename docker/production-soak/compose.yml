services:
  postgres:
    profiles: ["postgres"]
    image: postgres@sha256:2586e2a95d1c9b31cb2967feb562948f7d364854453d703039b6efa45fe48417
    environment:
      POSTGRES_DB: s3server
      POSTGRES_USER: s3
      POSTGRES_PASSWORD: s3audit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s3 -d s3server"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128

  mysql:
    profiles: ["mysql"]
    image: mysql@sha256:4890b3247d48a6dc1f3ac1e979330af4e543d06f194322f3879b27e6c7052585
    command: ["--innodb-buffer-pool-size=128M", "--performance-schema=OFF"]
    environment:
      MYSQL_DATABASE: s3server
      MYSQL_USER: s3
      MYSQL_PASSWORD: s3audit
      MYSQL_ROOT_PASSWORD: s3audit
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -us3 -ps3audit --silent"]
      interval: 2s
      timeout: 2s
      retries: 45
    volumes:
      - mysql-data:/var/lib/mysql
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128

  soak:
    image: ${S3_SOAK_IMAGE:?run through scripts/run-production-soak}
    pull_policy: never
    working_dir: /app
    command: ["/bin/sh", "scripts/production-soak-container"]
    user: "${S3_SOAK_HOST_UID:-10001}:${S3_SOAK_HOST_GID:-10001}"
    environment:
      HOME: /tmp
      S3_TEST_SERVER_STORAGE_DRIVER: filesystem
      S3_TEST_STORAGE_PATH: /soak-data/objects
      S3_METADATA_DRIVER: ${S3_SOAK_METADATA_DRIVER:-sqlite}
      S3_METADATA_DSN: ${S3_SOAK_METADATA_DSN:-}
      S3_METADATA_PATH: /soak-data/metadata/metadata.sqlite
      S3_TEST_PRODUCTION_SOAK: "1"
      S3_TEST_PRODUCTION_SOAK_SECONDS: ${S3_SOAK_DURATION_SECONDS:-43200}
      S3_TEST_PRODUCTION_SOAK_BATCH: ${S3_SOAK_BATCH:-10}
      S3_TEST_PRODUCTION_SOAK_OBJECT_BYTES: ${S3_SOAK_OBJECT_BYTES:-65536}
      S3_TEST_PRODUCTION_SOAK_CONCURRENCY: ${S3_SOAK_CONCURRENCY:-10}
      S3_TEST_PRODUCTION_SOAK_PAUSE_MILLISECONDS: ${S3_SOAK_PAUSE_MILLISECONDS:-5000}
      S3_TEST_PRODUCTION_SOAK_PROGRESS_SECONDS: ${S3_SOAK_PROGRESS_SECONDS:-300}
      S3_TEST_PRODUCTION_SOAK_MAX_RSS_GROWTH_BYTES: ${S3_SOAK_MAX_RSS_GROWTH_BYTES:-268435456}
      S3_TEST_PRODUCTION_SOAK_MAX_TOTAL_RSS_BYTES: ${S3_SOAK_MAX_TOTAL_RSS_BYTES:-805306368}
      S3_TEST_PRODUCTION_SOAK_MAX_BATCH_GAP_SECONDS: ${S3_SOAK_MAX_BATCH_GAP_SECONDS:-120}
      S3_TEST_SERVER_MEMORY_LIMIT: ${S3_SOAK_SERVER_MEMORY_LIMIT:-256M}
      S3_TEST_PRODUCTION_SOAK_DIAGNOSTICS_DIR: /soak-state
      S3_SOAK_COMMIT: ${S3_SOAK_COMMIT:-unknown}
      S3_SOAK_QUALIFICATION: ${S3_SOAK_QUALIFICATION:-smoke}
      S3_SOAK_STARTED_AT: ${S3_SOAK_STARTED_AT:-unknown}
      S3_SOAK_STARTED_EPOCH: ${S3_SOAK_STARTED_EPOCH:-0}
    volumes:
      - ../..:/app:ro
      - ${S3_SOAK_STATE_DIR:-/var/tmp/opsfour-s3-production-soak}:/soak-state
      - ${S3_SOAK_DATA_DIR:-/var/tmp/opsfour-s3-production-soak/data/default}:/soak-data
    tmpfs:
      - /tmp:size=268435456,mode=1777
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    pids_limit: 256
    init: true
    read_only: true
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres-data:
  mysql-data:
